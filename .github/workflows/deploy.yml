name: Deploy MR TECH AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static website for GitHub Pages
        run: npm run build:pages
        env:
          VITE_BASE: /MRTECH-AI-CREATED-BY-RAYYAN/

      - name: Verify build output and SPA fallback
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated!"
            exit 1
          fi
          # Ensure 404.html exists for single page app direct links and refreshes on GitHub Pages
          if [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi
          echo "Build verification successful. Files in dist:"
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
